<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PGN Upload</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="card">

    <h1>📂 Upload PGN</h1>

    <form method="POST"
          enctype="multipart/form-data">

        <input
            type="file"
            name="pgn_file"
            required>

        <br><br>

        <button type="submit">
            Upload
        </button>

    </form>

    <br>

    <a href="/dashboard">
        Back
    </a>

</div>

</body>
</html>

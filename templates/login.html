<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <title>Chess Bot V1 - Login</title>

</head>
<body>

<div class="card">

```
<h1>♟ Chess Bot V1</h1>

<h2>Login</h2>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

<form method="POST">

    <input
        type="text"
        name="username"
        placeholder="Username"
        required>

    <input
        type="password"
        name="password"
        placeholder="Password"
        required>

    <button type="submit">
        Login
    </button>

</form>

<p>
    No account?
    <a href="/register">Register</a>
</p>
```

</div>

</body>
</html>

<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <title>Chess Bot V1 - Register</title>

```

      href="{{ url_for('static', filename='css/style.css') }}">

</head>
<body>

<div class="card">

```
<h1>♟ Chess Bot V1</h1>

<h2>Create Account</h2>

{% if error %}
    <p>{{ error }}</p>
{% endif %}

<form method="POST">

    <input
        type="text"
        name="username"
        placeholder="Username"
        required>

    <input
        type="email"
        name="email"
        placeholder="Email"
        required>

    <input
        type="password"
        name="password"
        placeholder="Password"
        required>

    <button type="submit">
        Create Account
    </button>

</form>

<p>
    Already have an account?
    <a href="/login">Login</a>
</p>
```

</div>

</body>
</html>
